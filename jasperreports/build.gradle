// JasperReports Library (LGPL) reporting engine.
//
// In JasperReports 7.x the engine is split into optional artifacts. PDF export
// lives in a separate "jasperreports-pdf" module which must be added explicitly
// (otherwise JasperExportManager throws
//   "Missing JasperReports PDF Extension (jasperreports-pdf-x.x.x.jar)").
//
// jasperreports-pdf depends on a Jaspersoft-patched OpenPDF build
// (com.github.librepdf:openpdf:1.3.43.jaspersoft.2). We deliberately let that
// patched OpenPDF come in (rather than excluding it in favour of the stock
// 1.3.43 OFBiz ships) because the 7.x PDF exporter is compiled against it.
dependencies {
    pluginLibsCompile('net.sf.jasperreports:jasperreports:7.0.8') {
        exclude group: 'org.springframework'
        exclude group: 'org.hibernate'
        exclude group: 'com.github.kklisura.cdt'
    }
    pluginLibsCompile('net.sf.jasperreports:jasperreports-pdf:7.0.8') {
        exclude group: 'org.springframework'
        exclude group: 'org.hibernate'
        exclude group: 'com.github.kklisura.cdt'
    }
    // OpenPDF "fonts-extra" provides the built-in Asian (CJK) font resources
    // (e.g. HeiseiKakuGo-W5 with the UniJIS-UCS2-H encoding) so JasperReports
    // can render Japanese text to PDF without shipping a TTF font. The stock
    // 1.3.43 build is resource-only (cmap/AFM data) and works with the
    // jaspersoft-patched OpenPDF core pulled in by jasperreports-pdf.
    pluginLibsCompile 'com.github.librepdf:openpdf-fonts-extra:1.3.43'
}
